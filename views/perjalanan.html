            border-radius: var(--radius-md) 0 0 var(--radius-md);
        }
        .table-custom tr td:last-child {

        }
        .table-custom tr:hover td {
            background: #f8fafc;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

            <span style="color: var(--accent);">⚓</span> Fishing Log
        </a>
        <button class="nav-toggle" id="navToggle">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="dashboard.php" class="nav-link-custom">Dashboard</a></li>
            <li><a href="perjalanan.html" class="nav-link-custom active">Perjalanan</a></li>
            <li><a href="catatan_memancing.html" class="nav-link-custom">Catatan & Data</a></li>
            <li><a href="laporan.html" class="nav-link-custom">Laporan</a></li>
            <li class="mobile-only">
                <hr style="border: none; border-top: 1px solid var(--border); margin: 0.5rem 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0;">
                    <span id="themeTextMobile">Tema Malam</span>
                    <button class="themeToggleMobile btn-primary" style="background: var(--secondary); padding: 0.5rem; border-radius: 50%; width: 40px; height: 40px; justify-content: center;">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </li>
            <li class="mobile-only"><a href="../logout.php" class="nav-link-custom" style="color: var(--danger);">Logout</a></li>
        </ul>
        <div class="nav-user-info" style="display: flex; gap: 1rem; align-items: center;">
            <button id="themeToggle" class="btn-primary" style="background: var(--secondary); padding: 0.5rem; border-radius: 50%; width: 40px; height: 40px; justify-content: center;">
                <i class="fas fa-moon"></i>
            </button>
            <a href="../logout.php" class="btn-primary" style="background: var(--danger); padding: 0.5rem 1rem;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <main class="main-content">
        <header class="dashboard-header animate-fade" style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem;">Riwayat Perjalanan</h1>
                <p style="color: var(--text-muted);">Kelola semua ekspedisi memancing Anda di sini.</p>
            </div>
            <button id="btnAdd" class="btn-primary">
                <i class="fas fa-plus"></i> Tambah Perjalanan
            </button>
        </header>

        <div id="alertPlaceholder"></div>

        <section class="animate-fade" style="animation-delay: 0.1s;">
            <div class="table-responsive">
                <table class="table-custom" id="tripsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Waktu Mulai</th>
                            <th>Waktu Selesai</th>
                            <th>Jarak (km)</th>
                            <th style="text-align: right;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="tripModal" class="glass" style="display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; background: rgba(0,0,0,0.5);">
        <div class="glass" style="background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius-lg); padding: 2rem;">
            <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Tambah Perjalanan</h2>
            <form id="tripForm">
                <input type="hidden" id="id_perjalanan">
                <div class="form-group">
                    <label class="form-label">Waktu Mulai</label>
                    <input type="datetime-local" id="waktu_mulai" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Waktu Selesai</label>
                    <input type="datetime-local" id="waktu_selesai" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Jarak (km)</label>
                    <input type="number" step="0.01" id="jarak_lokasi" class="form-input" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" onclick="closeModal()" class="btn-primary" style="background: var(--secondary); flex: 1; justify-content: center;">Batal</button>
                    <button type="submit" class="btn-primary" style="flex: 2; justify-content: center;">Simpan Perjalanan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const api = '../api/perjalanan_api.php';

        $(document).ready(function () {
            // Dark Mode Logic
            const body = $('body');
            const themeToggles = $('#themeToggle, .themeToggleMobile');
            
            function updateThemeIcons(isDark) {
                const icons = themeToggles.find('i');
                const text = $('#themeTextMobile');
                if (isDark) {
                    icons.removeClass('fa-moon').addClass('fa-sun');
                    text.text('Tema Terang');
                } else {
                    icons.removeClass('fa-sun').addClass('fa-moon');
                    text.text('Tema Malam');
                }
            }

            if (localStorage.getItem('theme') === 'dark') {
                body.addClass('dark-mode');
                updateThemeIcons(true);
            }

            themeToggles.on('click', function() {
                body.toggleClass('dark-mode');
                const isDark = body.hasClass('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeIcons(isDark);
            });

            loadTrips();

            $('#navToggle').on('click', function() {
                $('#navLinks').toggleClass('active');
                $(this).find('i').toggleClass('fa-bars fa-times');
            });

            $('#btnAdd').on('click', function () {
                $('#modalTitle').text('Tambah Perjalanan');
                $('#tripForm')[0].reset();
                $('#id_perjalanan').val('');
                $('#tripModal').css('display', 'flex');
            });

            $('#tripForm').on('submit', function (e) {
                e.preventDefault();
                const id = $('#id_perjalanan').val();
                const data = {
                    waktu_mulai: $('#waktu_mulai').val().replace('T', ' '),
                    waktu_selesai: $('#waktu_selesai').val().replace('T', ' '),
                    jarak_lokasi: parseFloat($('#jarak_lokasi').val())
                };

                const method = id ? 'PUT' : 'POST';
                if(id) data.id_perjalanan = parseInt(id);

                $.ajax({
                    url: api,
                    method: method,
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (res) {
                        closeModal();
                        loadTrips();
                        showAlert(id ? 'Perjalanan diperbarui!' : 'Perjalanan ditambahkan!', 'success');
                    },
                    error: handleAjaxError
                });
            });

            $('#tripsTable').on('click', '.btn-edit', function () {
                const id = $(this).data('id');
                $.get(api + '?id=' + id, function (res) {
                    if (res.success && res.data) {
                        $('#modalTitle').text('Edit Perjalanan');
                        $('#id_perjalanan').val(res.data.id_perjalanan);
                        $('#waktu_mulai').val(res.data.waktu_mulai.replace(' ', 'T'));
                        $('#waktu_selesai').val(res.data.waktu_selesai.replace(' ', 'T'));
                        $('#jarak_lokasi').val(res.data.jarak_lokasi);
                        $('#tripModal').css('display', 'flex');
                    }
                }).fail(handleAjaxError);
            });

            $('#tripsTable').on('click', '.btn-delete', function () {
                const id = $(this).data('id');
                if (!confirm('Hapus perjalanan ini?')) return;

                $.ajax({
                    url: api,
                    method: 'DELETE',
                    contentType: 'application/json',
                    data: JSON.stringify({ id_perjalanan: id }),
                    success: function (res) {
                        loadTrips();
                        showAlert('Perjalanan dihapus!', 'success');
                    },
                    error: handleAjaxError
                });
            });
        });

        function loadTrips() {
            $.get(api, function (res) {
                if (!res.success) return;
                const tbody = $('#tripsTable tbody').empty();
                res.data.forEach(function (row) {
                    const tr = $('<tr>');
                    tr.append(`<td><span class="stat-value" style="font-size: 1rem;">#${row.id_perjalanan}</span></td>`);
                    tr.append(`<td>${row.waktu_mulai}</td>`);
                    tr.append(`<td>${row.waktu_selesai}</td>`);
                    tr.append(`<td>${row.jarak_lokasi} km</td>`);
                    tr.append(`<td style="text-align: right;">
                        <button class="btn-primary btn-edit" data-id="${row.id_perjalanan}" style="padding: 0.5rem 1rem; font-size: 0.75rem;">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-primary btn-delete" data-id="${row.id_perjalanan}" style="padding: 0.5rem 1rem; font-size: 0.75rem; background: var(--danger);">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>`);
                    tbody.append(tr);
                });
            }).fail(handleAjaxError);
        }

        function closeModal() {
            $('#tripModal').hide();
        }

        function showAlert(msg, type) {
            const color = type === 'success' ? 'var(--success)' : 'var(--danger)';
            const alert = $(`<div class="animate-fade" style="padding: 1rem; background: var(--surface); color: var(--text-main); border-left: 4px solid ${color}; border-radius: var(--radius-md); box-shadow: var(--shadow-md); margin-bottom: 2rem;">${msg}</div>`);
            $('#alertPlaceholder').html(alert);
            setTimeout(() => alert.fadeOut(), 3000);
        }

        function handleAjaxError(xhr) {
            showAlert('Terjadi kesalahan: ' + (xhr.responseJSON?.message || 'Server Error'), 'error');
        }
    </script>
</body>
</html>

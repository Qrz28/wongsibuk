<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fishing Log</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=1.2">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-page" style="background-image: url('../assets/img/fishing_bg.png');">
        <div class="auth-card glass animate-fade">
            <div class="text-center mb-4">
                <div style="font-size: 3rem; color: var(--accent);">⚓</div>
                <h1 class="auth-title">Fishing Log</h1>
                <p class="auth-subtitle">Selamat datang kembali, Kapten!</p>
            </div>

            <div id="alertMessage" class="mb-4" style="display: none; padding: 1rem; border-radius: var(--radius-md); font-size: 0.875rem;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Kata Sandi</label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4" style="display: flex; justify-content: space-between; font-size: 0.875rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="remember" name="remember" style="width: 1rem; height: 1rem; cursor: pointer;">
                        Ingat saya
                    </label>
                    <a href="#" style="color: var(--accent); text-decoration: none; font-weight: 500;">Lupa Password?</a>
                </div>

                <button type="submit" class="btn-primary w-100" style="width: 100%; justify-content: center;">
                    <i class="fas fa-sign-in-alt"></i> Masuk Sekarang
                </button>
            </form>

            <div class="mt-4 text-center" style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
                Belum punya akun? <a href="register.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#loginForm').on('submit', function (e) {
                e.preventDefault();
                const $btn = $(this).find('button');
                const originalText = $btn.html();
                
                $btn.prop('disabled', true).html('<i class="fas fa-circle-notch fa-spin"></i> Memproses...');
                $('#alertMessage').slideUp();

                $.ajax({
                    type: 'POST',
                    url: '../api/user_api.php',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        action: 'login',
                        email: $('#email').val(),
                        password: $('#password').val(),
                        remember: $('#remember').is(':checked')
                    }),
                    success: function (response) {
                        if (response.success) {
                            showAlert('Login berhasil! Mengalihkan...', 'success');
                            setTimeout(() => window.location.href = response.redirect || 'dashboard.php', 1500);
                        } else {
                            showAlert(response.message || 'Login gagal!', 'error');
                            $btn.prop('disabled', false).html(originalText);
                        }
                    },
                    error: function (xhr) {
                        showAlert('Terjadi kesalahan server.', 'error');
                        $btn.prop('disabled', false).html(originalText);
                    }
                });
            });

            function showAlert(msg, type) {
                const bg = type === 'success' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                const color = type === 'success' ? 'var(--success)' : 'var(--danger)';
                const border = type === 'success' ? '1px solid var(--success)' : '1px solid var(--danger)';
                
                $('#alertMessage').html(msg).css({
                    'display': 'block',
                    'background': bg,
                    'color': color,
                    'border': border
                });
            }
        });
    </script>
</body>
</html>
